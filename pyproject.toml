[project]
name = "tg-max-bridge"
version = "0.1.8"
description = "Relay text between two people across Telegram and Max"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
tg-max-bridge = "tg_max_bridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tg_max_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
